_target_: src.models.convnext_module.ConvNeXtLitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 4e-3
  weight_decay: 0.05

scheduler: null

# ConvNeXt-Tiny backbone in feature-extraction mode (num_classes=0 -> Identity head).
# Produces DINOv3-compatible embeddings; run inference with `trainer.predict`.
net:
  _target_: src.models.components.convnext.ConvNeXt
  in_chans: 3
  num_classes: 0
  depths: [3, 3, 9, 3]
  dims: [96, 192, 384, 768]
  drop_path_rate: 0.0
  layer_scale_init_value: 1.0e-6

compile: false