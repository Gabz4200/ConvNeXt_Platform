# @package _global_

# To execute this experiment run:
# python src/train.py experiment=smb_gamepad

defaults:
  - override /data: smb
  - override /model: convnext_rwkv7_gamepad
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["smb", "super_mario_bros", "gamepad", "convnext_rwkv7"]

seed: 3407

trainer:
  min_epochs: 1
  max_epochs: 10

data:
  batch_size: 32
  max_samples: null
  download: true

model:
  optimizer:
    lr: 1.0e-3
    weight_decay: 0.01
  freeze_convnext: true
  convnext_lr: null
