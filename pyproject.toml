# Project metadata and dependencies (replaces setup.py and requirements.txt).
# For conda environments, see environment.yaml.

[project]
name = "convnext-platform"
version = "0.0.1"
description = "ConvNeXt Platform: gamepad control vision-temporal model with DINOv3 and RWKV-7"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "lightning>=2.0.0",
    "torchmetrics>=0.11.4",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "hydra-optuna-sweeper==1.2.0",
    "omegaconf>=2.3.0",
    "datasets>=2.14.0",
    "huggingface-hub>=0.19.0",
    "safetensors>=0.3.0",
    "timm>=0.9.0",
    "rootutils",
    "rich",
    "numpy>=2.2.6",
    "torchao>=0.18.0",
    "matplotlib>=3.10.9",
    "einops>=0.8.2",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyrefly",
    "pytest",
    "setuptools",
]

[project.scripts]
train_command = "src.train:main"
eval_command = "src.eval:main"
train_nitrogen = "src.train_nitrogen:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = ["tests/"]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchao = { index = "pytorch" }

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
]
